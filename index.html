<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EMR Report Extractor v7.0</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f3f5f8;
    color: #1e293b;
  }
  .container {
    max-width: 820px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 12px;
  }
  .title-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  h1 {
    font-size: 16px;
    font-weight: 700;
    margin: 0;
    color: #0f172a;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 999px;
    background: #eff6ff;
    color: #1d4ed8;
    border: 1px solid #bfdbfe;
  }
  .ver {
    font-size: 11px;
    color: #64748b;
    font-weight: 600;
  }
  .label-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }
  label {
    font-size: 12px;
    font-weight: 600;
    color: #475569;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  textarea {
    width: 100%;
    border: 1px solid #cbd5e1;
    border-radius: 8px;
    padding: 12px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    color: #0f172a;
    resize: vertical;
  }
  textarea:focus {
    outline: none;
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  #reportInput {
    height: 190px;
    margin-bottom: 16px;
  }
  #emrOutput {
    height: 155px;
    background: #f8fafc;
    font-weight: 500;
  }
  .btn-group {
    display: flex;
    gap: 8px;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 600;
    transition: background 0.15s ease;
  }
  .btn-primary {
    background: #2563eb;
    color: #ffffff;
  }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-secondary {
    background: #e2e8f0;
    color: #334155;
  }
  .btn-secondary:hover { background: #cbd5e1; }
  .btn-copied {
    background: #16a34a !important;
    color: #ffffff !important;
  }

  select { border:1px solid #cbd5e1; border-radius:6px; padding:5px 8px; font-size:12px; font-weight:600; color:#334155; background:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px; }
  .chip { background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; border-radius:999px; padding:5px 11px; }
  .chip.active { background:#e6f7f5; border-color:#5eead4; color:#0f766e; }
  .hint { font-size:11px; color:#64748b; margin:-10px 0 14px; }
  #reportInput { height: 230px; }
  #emrOutput { height: 170px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="title-wrap">
      <h1>EMR Report Extractor</h1>
      <span class="ver">v7.0</span>
      <span id="reportBadge" class="badge">Ready</span>
    </div>
    <div class="btn-group">
      <select id="typeSel" aria-label="Report type">
        <option value="auto">Auto detect</option>
        <option value="path_breast">Pathology · Breast</option>
        <option value="path_hn">Pathology · Head &amp; Neck</option>
        <option value="us">Breast US</option>
        <option value="ctmri">CT / MRI</option>
      </select>
      <button type="button" class="btn-secondary" id="clearBtn">Clear</button>
    </div>
  </div>

  <div class="label-row">
    <label for="reportInput">Report Text (Pathology / Breast US / CT / MRI)</label>
  </div>
  <textarea id="reportInput" placeholder="Paste a pathology, breast ultrasound, CT or MRI report here..."></textarea>

  <div class="label-row">
    <label for="emrOutput">EMR Result (English)</label>
    <button type="button" class="btn-primary" id="copyBtn">Copy Result</button>
  </div>
  <div id="chipBox" class="chips" style="display:none"></div>
  <textarea id="emrOutput"></textarea>
</div>

<script>
/* ===== 病理報告解析 ===== */
const state = {
  autoParsed: { breast: {}, headneck: {} }, manualParams: { breast: {}, headneck: {} },
  options: { breastShowLnDetail: true, breastShowTreatment: true, ki67UpperOnly: true, her2WithPercent: true, marginFullDetail: false,
             hnShowLnZones: true, hnShowWpoi: true, hnShowTreatment: true, hnEneDetail: true }
};
const CHIPS = {
  breast: [["breastShowLnDetail","顯示 LN 分區與 ENE"],["breastShowTreatment","顯示 Treatment Effect"],
           ["ki67UpperOnly","Ki-67 顯示上限","Ki-67 顯示原始區間","ki67"],["her2WithPercent","HER2 顯示 % 細節","HER2 僅顯示 Score","her2"],
           ["marginFullDetail","Margin 顯示完整（含各方向）",null,"margin"]],
  headneck: [["hnShowLnZones","標示陽性淋巴結區域"],["hnShowWpoi","顯示 WPOI"],["hnShowTreatment","顯示 Treatment Effect"],
             ["hnEneDetail","ENE 顯示雙側/最大灶細節",null,"ene"]]
};

/* ---------- 原有的輔助函式（Margin / Treatment / 分數格式） ---------- */
function normalizeGradeNumber(t) { t = (t || "").trim().toUpperCase(); return t === "I" ? "1" : t === "II" ? "2" : t === "III" ? "3" : t; }
function normalizeZoneLabel(z) {
  let s = (z || "").replace(/^["']|["']$/g, "").trim();
  s = s.replace(/\s+lymph\s+nodes?$|\s+LNs?$/i, "").trim().replace(/\bleft\b/gi, "L").replace(/\bright\b/gi, "R").replace(/\blevel\s+/gi, "level ");
  return s.replace(/\s+/g, " ").trim();
}
function extractHer2ZeroDetail(tail) {
  const s = (tail || "").trim();
  const pm = [...s.matchAll(/\(([^()]*%[^()]*)\)/g)];
  if (pm.length) {
    const picked = pm.map((m) => m[1].trim()).filter((p) => !/immunoreactive\s+tumor\s+cells/i.test(p));
    if (picked.length) return `(${picked.join(", ")})`;
  }
  const pc = s.match(/([<>≦≥]?\s*\d+(?:\.\d+)?\s*%)/);
  if (pc) return `(${pc[1].trim()})`;
  return /no\s+tumor\s+cells|0\s*%/i.test(s) ? "(0%)" : "";
}
function parseMarginDistanceToMm(d) {
  const s = (d || "").trim(), n = s.match(/(\d+(?:\.\d+)?)/);
  if (!n) return Infinity;
  let v = parseFloat(n[1]);
  if (/\bcm\b/i.test(s)) v *= 10;
  if (/^\s*</.test(s)) v -= 0.01;
  return v;
}
function formatMarginDistToken(d) {
  const s = (d || "").replace(/\s+/g, "").trim(), m = s.match(/^([<>≦≥]?)(\d+(?:\.\d+)?)(mm|cm)$/i);
  if (!m) return s;
  const op = m[1] === "≦" ? "<" : m[1] === "≥" ? ">" : m[1], num = parseFloat(m[2]), unit = m[3].toLowerCase();
  return unit === "mm" && num >= 10 ? `${op}${+(num / 10).toFixed(2)}cm` : `${op}${num}${unit}`;
}
function parseBreastTreatmentEffect(text) {
  const m = text.match(/treatment\s+effect\s*[:\-–—]\s*([^\n]+(?:\n[ \t]+[a-z]\.[^\n]+(?:\n[ \t]+[^\n]+)?)*)/i);
  if (!m) return { val: "", ok: false };
  const block = m[1].replace(/\s+/g, " ").trim();
  if (/^\s*N\/?A\b|not\s+applicable|no\s+info|not\s+evaluated/i.test(block)) return { val: "", ok: false };
  if (/^\s*absent\b|no\s+definite\s+response/i.test(block)) return { val: "absent", ok: true };
  const br = block.match(/in\s+the\s+breast\s*[-–—]\s*([^(;.\n]+)/i);
  const r = (br ? br[1] : block).trim();
  if (/no\s+definite\s+response/i.test(r)) return { val: "absent", ok: true };
  if (/complete\s+response|no\s+residual\s+invasive/i.test(r)) return { val: "complete response", ok: true };
  if (/probable\s+or\s+definite\s+response/i.test(r)) return { val: "probable/definite response", ok: true };
  if (/absent|no\s+response/i.test(r)) return { val: "absent", ok: true };
  return { val: r.replace(/^present\s*,?\s*/i, "").trim() || "present", ok: true };
}
function parseBreastMargins(text) {
  const sm = text.match(/(?:surgical\s+)?margins?\(?s?\)?\s*[:\-–—]\s*([\s\S]*?)(?=\n\s*\d+\.|$)/i);
  if (!sm) return { short: "", full: "", ok: false };
  const raw = sm[1], mText = raw.replace(/\s+/g, " ").trim();
  const inv = mText.match(/(?:focally\s+)?involved\s*(?:\(inked\))?\s*by\s+carcinoma(?:\s+at\s+([^;.\n]+?))?(?:\s*;\s*([<>]?\s*\d+(?:\.\d+)?\s*(?:cm|mm)))?/i);
  if (inv) {
    const dir = formatDirection(inv[1]), dist = inv[2] ? formatMarginDistToken(inv[2]) : "";
    return { short: `margin+${dir ? ` at ${dir}` : ""}${dist ? ` (${dist})` : ""}`, full: `margin+ (inked${dir ? ` at ${dir}` : ""}${dist ? `, ${dist}` : ""})`, ok: true };
  }
  const subs = [];
  for (const line of raw.replace(/\n[ \t]{4,}/g, " ").split("\n")) {
    const m = line.match(/^\s*[-*•]\s*([^:\n]+?)\s*:\s*([^\n]+)/);
    if (!m) continue;
    const dir = formatDirection(m[1].replace(/\bdouble\s+checked\b[\s\S]*$/i, "")), body = m[2].trim();
    const dm = body.match(/(?:closest\s+margin\s*\(?|closest\s+distance\s+is\s*|margin\s+distance\s+(?:less\s+than\s+|of\s+)?)([<>]?\s*\d+(?:\.\d+)?\s*(?:mm|cm))/i);
    if (dm) {
      let rd = dm[1].replace(/\s+/g, "");
      if (/less\s+than/i.test(body) && !rd.startsWith("<")) rd = `<${rd}`;
      subs.push({ mm: parseMarginDistanceToMm(rd), text: `margin ${formatMarginDistToken(rd)}${dir ? ` at ${dir}` : ""}` });
    } else if (/\bnegative\b|\buninvolved\b/i.test(body)) subs.push({ mm: Infinity, text: `margin negative${dir ? ` at ${dir}` : ""}` });
  }
  if (subs.length) { subs.sort((a, b) => a.mm - b.mm); return { short: subs[0].text, full: subs.map((e) => e.text).join(", "), ok: true }; }
  const cm = mText.match(/closest\s+margin\s*\(\s*([<>]?\s*\d+(?:\.\d+)?\s*(?:mm|cm))(?:\s+(?:from|at)\s+(?:the\s+)?([a-z ]+?)(?:\s+margin)?)?\s*\)/i);
  if (cm) { const d = formatDirection(cm[2]), tx = `margin ${formatMarginDistToken(cm[1])}${d ? ` at ${d}` : ""}`; return { short: tx, full: tx, ok: true }; }
  const entries = [];
  for (const line of raw.split("\n")) {
    if (/^\s*(?:\d+\)|[a-z]\))\s/i.test(line)) entries.push(line.trim());
    else if (entries.length && /^\s{6,}\S/.test(line)) entries[entries.length - 1] += " " + line.trim();
  }
  const pe = [];
  for (const e of entries) {
    const lt = e.match(/(?:less\s+than|<)\s*(\d+(?:\.\d+)?)\s*(mm|cm)/i), dm = lt ? null : e.match(/(\d+(?:\.\d+)?)\s*(mm|cm)/i);
    if (!lt && !dm) continue;
    const dist = formatMarginDistToken(lt ? `<${lt[1]}${lt[2]}` : `${dm[1]}${dm[2]}`);
    const dm2 = e.match(/.*\bat\s+(?:the\s+)?([^;]+?)\s*$/i) || e.match(/\bfrom\s+(?:the\s+)?([a-z ]+?)\s+margin/i);
    const dir = dm2 ? formatDirection(dm2[1]) : "";
    const tg = /DCIS|in\s+situ/i.test(e) ? "DCIS" : /invasive/i.test(e) ? "invasive" : "";
    pe.push({ mm: parseMarginDistanceToMm(dist), tg, txt: `${dist}${dir ? ` at ${dir}` : ""}${tg ? ` (${tg})` : ""}` });
  }
  if (pe.length) {
    const all = `margin ${pe.map((e) => e.txt).join(", ")}`;
    const distinct = new Set(pe.map((e) => e.tg).filter(Boolean)).size > 1;
    pe.sort((a, b) => a.mm - b.mm);
    return { short: distinct ? all : `margin ${pe[0].txt}`, full: all, ok: true };
  }
  const ent = [];
  const mk = (re) => { const m = mText.match(re); if (m) { const d = formatDirection(m[2]); ent.push({ dist: parseFloat(m[1]), text: `margin ${m[1]}cm${d ? ` at ${d}` : ""}` }); } };
  mk(/(\d+(?:\.\d+)?)\s*cm\s+to\s+invasive\s+carcinoma(?:\s+at\s+([^.;]+?))?(?=\s+and\s+|\s*[.;]|$)/i);
  mk(/(\d+(?:\.\d+)?)\s*cm\s+to\s+DCIS(?:\s+at\s+([^.;]+?))?(?=\s+and\s+|\s*[.;]|$)/i);
  if (!ent.length) mk(/(?:distance\s+from\s+closest\s+margin\s+is|closest\s+distance\s+is)\s+(\d+(?:\.\d+)?)\s*cm(?:\s+at\s+([^.;]+?))?(?=\s*[.;]|$)/i);
  if (ent.length) { ent.sort((a, b) => a.dist - b.dist); return { short: ent[0].text, full: ent.map((e) => e.text).join(", "), ok: true }; }
  if (/^\s*uninvolved\b/i.test(mText)) return { short: "margin uninvolved", full: "margin uninvolved", ok: true };
  if (/\b(?:positive|involved)\b/i.test(mText) && !/negative|uninvolved|free/i.test(mText)) return { short: "margin+", full: "margin+", ok: true };
  if (/\bnegative\b|\bfree\b|uninvolved/i.test(mText)) return { short: "margin negative", full: "margin negative", ok: true };
  return { short: "", full: "", ok: false };
}

/* ===================================================================
 * 病理報告解析修正包
 * 用法：整段貼到原檔 <script> 內、window.addEventListener("DOMContentLoaded"...) 之前。
 * 同名 function 後宣告者覆蓋先宣告者，所以不需要刪除原本的函式。
 * =================================================================== */

/* ---------- 共用工具 ---------- */
const _flat = (s) => (s || "").replace(/\s+/g, " ").trim();

/** 以「欄位標題」為起點，擷取到下一個欄位（編號項 / 全大寫標題 / 另一個 label:）為止。找不到回傳 null */
function getSection(text, labelSrc) {
  const lines = (text || "").split(/\r?\n/);
  const startRe = new RegExp("^(\\s{0,4})((?:\\d+[.)]|[a-z][.)])\\s*)?(?:" + labelSrc + ")\\s*(?:\\([^)]*\\))?\\s*[:：\\-–—]\\s*(.*)$", "i");
  for (let i = 0; i < lines.length; i++) {
    const m = lines[i].match(startRe);
    if (!m) continue;
    const letterStart = /^[a-z]/i.test(m[2] || "");
    const out = [m[3]];
    for (let j = i + 1; j < lines.length; j++) {
      const l = lines[j];
      if (/^\s{0,3}\d+[.)]\s/.test(l)) break;                                   // 下一個編號項
      if (letterStart && /^\s{0,4}[a-z][.)]\s/i.test(l)) break;                // 下一個 a. b. c. 項目
      if (/^\s{0,3}[A-Z][A-Z0-9 &\/\-]{5,}:/.test(l)) break;                    // 全大寫標題
      if (/^\s{0,3}[A-Za-z][A-Za-z0-9 \/()\-]{2,60}\s*[:：]/.test(l)) break;     // 另一個「label:」
      if (/^\s{0,3}[A-Za-z][A-Za-z0-9 \/()]{2,60}\s+[-–—]\s+\S/.test(l)) break; // 另一個「label - value」
      out.push(l);
    }
    return out.join("\n");
  }
  return null;
}

function getField(text, labelSrc) {
  const sec = getSection(text, labelSrc);
  if (sec !== null) return sec;
  const m = (text || "").match(new RegExp("(?:" + labelSrc + ")\\s*(?:\\([^)]*\\))?\\s*[:：\\-–—]\\s*([^\\n]*(?:\\n[ \\t]{4,}[^\\n]*)*)", "i"));
  return m ? m[1] : null;
}

function signOf(v) {
  if (v === null || v === undefined) return null;
  const s = _flat(v);
  if (/not\s+(?:identified|seen|present|detected|found)|absent|negative|\bnone\b|\bno\b|\(\s*-\s*\)/i.test(s)) return false;
  if (/present|identified|positive|detected|seen|involved|suspicious|\(\s*\+\s*\)/i.test(s)) return true;
  return null;
}

function detectEne(s) {
  const t = s || "";
  const E = "(?:extranodal|extracapsular)\\s+extension(?:\\s*\\(\\s*ENE\\s*\\))?";
  const pos = new RegExp(
    E + "\\s*[:\\-–—=]*\\s*(?:is\\s+|are\\s+)?(?:present|identified|positive|seen|\\(\\s*\\+\\s*\\)|\\+)" +
    "|\\bwith\\s+" + E + "|\\bENE\\s*[:\\-–—]?\\s*(?:positive|present|\\(\\s*\\+\\s*\\)|\\+)|\\bENE[-_\\s]*positive", "i");
  const neg = new RegExp(
    "\\b(?:without|no|negative\\s+for)\\s+(?:evidence\\s+of\\s+)?" + E +
    "|" + E + "\\s*[:\\-–—=]*\\s*(?:is\\s+|are\\s+)?(?:absent|not\\s+(?:identified|seen|present)|negative|none|\\(\\s*-\\s*\\)|-)" +
    "|\\bENE\\s*[:\\-–—]?\\s*(?:negative|absent|\\(\\s*-\\s*\\)|-)(?![A-Za-z])", "i");
  if (pos.test(t)) return true;
  if (neg.test(t)) return false;
  return null;
}

function sizeFromScope(scope) {
  const s = _flat(scope);
  if (!s || /not\s+applicable|^N\/?A\b/i.test(s)) return "";
  const multi = s.match(/(\d+(?:\.\d+)?(?:\s*[x×*]\s*\d+(?:\.\d+)?)+)\s*(mm|cm)\b/i);
  if (multi) {
    let mx = Math.max(...multi[1].match(/\d+(?:\.\d+)?/g).map(Number));
    if (/mm/i.test(multi[2])) mx = +(mx / 10).toFixed(2);
    return `${mx}cm`;
  }
  const pair = s.match(/\b(\d+(?:\.\d+)?)\s*(?:and|,|&)\s*(\d+(?:\.\d+)?)\s*(mm|cm)\b/i);
  if (pair) {
    const f = /mm/i.test(pair[3]) ? 10 : 1;
    const a = +pair[1], b = +pair[2];
    return `${+(Math.max(a, b) / f).toFixed(2)}cm (${+(Math.min(a, b) / f).toFixed(2)}cm)`;
  }
  const one = s.match(/(\d+(?:\.\d+)?)\s*(mm|cm)\b/i);
  if (one) {
    let v = +one[1];
    if (/mm/i.test(one[2])) v = +(v / 10).toFixed(2);
    return `${v}cm`;
  }
  return "";
}

function gradeFromValue(v) {
  const s = _flat(v);
  if (!s) return "";
  const m = s.match(/grade\s*[:\-]?\s*(III|II|I|[1-4])\b/i) || s.match(/\bG\s*([1-4])\b/) || s.match(/^\W*(III|II|I|[1-4])\b/i);
  if (m) return `grade ${normalizeGradeNumber(m[1])}`;
  if (/well[-\s]differentiated|\blow\b/i.test(s)) return "grade 1";
  if (/moderate(?:ly)?[-\s]differentiated|intermediate/i.test(s)) return "grade 2";
  if (/poor(?:ly)?[-\s]differentiated|\bhigh\b|undifferentiated/i.test(s)) return "grade 3";
  return "";
}

/** 淋巴結分區：a. Left level II - 2/15 ... 或 Level IIA: 0/3 */
function parseLnZones(scope) {
  const out = [];
  for (const line of (scope || "").split(/\r?\n/)) {
    if (/size\s+of\s+largest/i.test(line)) continue;
    const m = line.match(/^\s*(?:[a-z]\.|[-*•]|\d+\))?\s*([^:\n–—]*?[A-Za-z][^:\n–—]*?)(?:\s+[-–—]\s+|\s*[:：]\s*)(\d+)\s*\/\s*(\d+)([^\n]*)/);
    if (!m) continue;
    if (/^\s*(?:overall|total|no\.?|number)\b/i.test(m[1])) continue;
    out.push({ name: normalizeZoneLabel(m[1]), pos: +m[2], tot: +m[3], rest: m[4] || "" });
  }
  return out;
}

/** T / N 分期：支援 pT2N1a(sn)、ypT1cN0(i+)、(1/11, N1a)、(T1c and T2) */
function parseTNM(text, lnScope, allowSn) {
  const tRe = /(?<![A-Za-z0-9])(yp|p|c)?T(is|X|[0-4])([a-d]|mi)?(?![A-MO-Za-z0-9])/gi;
  const nRe = /(?<![A-Za-z0-9])(yp|p|c)?N(X|[0-3])([a-c]|mi)?((?:\((?:sn|f|i[+-]|mol[+-])\)|\[(?:sn|f)\])*)(?![A-LN-Za-z0-9])/gi;
  const all = (re, s) => [...(s || "").matchAll(re)];

  let ts = all(tRe, text).filter((m) => m[1]);
  if (ts.length === 0) ts = all(tRe, text).filter((m) => /^[1-4]|is/i.test(m[2]));
  const rankT = (m) => (/is/i.test(m[2]) ? 0 : (+m[2] || 0) * 10) + ({ a: 1, b: 2, c: 3, d: 4 }[(m[3] || "").toLowerCase()] || 0);
  ts.sort((a, b) => rankT(b) - rankT(a));

  let ns = all(nRe, text).filter((m) => m[1]);
  if (ns.length === 0) ns = all(nRe, lnScope || "");
  ns.sort((a, b) => (b[4] ? 1 : 0) - (a[4] ? 1 : 0));

  if (!ts.length && !ns.length) return { stage: "", t: "", n: "" };
  const isYp = [...ts, ...ns].some((m) => /^yp$/i.test(m[1] || ""));
  const P = isYp ? "yp" : "p";
  const T = ts[0] ? `${P}T${ts[0][2].replace(/^is$/i, "is").replace(/^x$/i, "X")}${(ts[0][3] || "").toLowerCase()}` : "";
  let N = "";
  if (ns[0]) {
    let mods = ns[0][4] || "";
    if (allowSn && /sentinel/i.test(text) && !/\((?:sn)\)|\[sn\]/i.test(mods)) mods += "(sn)";
    N = `N${ns[0][2].toUpperCase()}${(ns[0][3] || "").toLowerCase()}${mods}`;
  }
  return { stage: `${T}${N}`, t: T, n: N };
}

/* ---------- 癌別偵測（改成計分，不再被 pT/pN/ENE 誤導） ---------- */
function detectCancerType(text) {
  const t = text || "";
  const hit = (re) => (re.test(t) ? 1 : 0);
  const b =
    2 * (hit(/\bestrogen\s+receptor\b/i) + hit(/\bprogesterone\s+receptor\b/i) + hit(/\bher-?2\b/i) + hit(/\bki-?67\b/i) +
      hit(/\bdcis\b|ductal\s+carcinoma\s+in\s+situ|\blcis\b/i) + hit(/\bbreast\b|\bmammary\b|\bnipple\b|mastectomy|lumpectomy/i) +
      hit(/nottingham/i) + hit(/invasive\s+(?:lobular|ductal)/i) + hit(/(?<![A-Za-z])(?:ER|PR)(?![A-Za-z])/)) +
    hit(/axillary|sentinel/i);
  const h =
    2 * (hit(/depth\s+of\s+invasion|\bDOI\b/i) + hit(/perineural/i) + hit(/\bWPOI\b|worst\s+pattern/i) +
      hit(/\boral\b|tongue|buccal|gingiv|palate|floor\s+of\s+mouth|laryn|pharyn|tonsil|mandib|maxill|neck\s+dissection/i) +
      hit(/squamous\s+cell\s+carcinoma/i)) +
    hit(/\blevel\s+(?:I{1,3}|IV|V|VI)[ab]?\b/i);
  if (b === 0 && h === 0) return { type: "breast", reason: "尚未偵測到明確特徵（預設乳癌）" };
  if (b >= h) return { type: "breast", reason: `乳癌特徵 ${b} 分 vs 頭頸癌 ${h} 分` };
  return { type: "headneck", reason: `頭頸癌特徵 ${h} 分 vs 乳癌 ${b} 分` };
}

/* ---------- 小修：方向字串先去掉括號（避免出現 "superficial margin (" ） ---------- */
function formatDirection(dirRaw) {
  if (!dirRaw) return "";
  let s = dirRaw.replace(/\([^)]*\)/g, " ").replace(/\(.*$/, " ").trim().toLowerCase();
  const clockMatch = s.match(/(\d{1,2})\s*o['’]?clock/);
  if (clockMatch) return `${clockMatch[1]}'`;
  s = s.replace(/\s+margin$/i, "").replace(/\s+direction(?:\s+end)?$/i, "").replace(/\s+end$/i, "").trim();
  return s;
}

/* ---------- HER2 ---------- */
function _parseHer2Core(text) {
  const lines = (text || "").split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (!/her[\s-]?2|c-?erb-?b2/i.test(line)) continue;
    if (/prior\s+(?:core\s+)?biops/i.test(line) && !/[:\-–—]\s*(positive|negative|equivocal|[0-3]\s*[+＋]|score)/i.test(line)) continue;
    let h = line;
    if (lines[i + 1] && /^\s{4,}\S/.test(lines[i + 1])) h += " " + lines[i + 1].trim();
    h = h.replace(/＋/g, "+").replace(/[–—]/g, "-");
    const nm = h.match(/her[\s-]?2(?:\s*\/\s*neu)?|c-?erb-?b2/i);
    const rest = h.slice(nm.index + nm[0].length);
    const ci = rest.search(/[:：]/);
    const tail = (ci >= 0 ? rest.slice(ci + 1) : rest.replace(/^\s*-\s*/, "")).trim();

    let fish = "";
    const fm = tail.match(/(?:FISH|SISH|CISH|\bISH)[^;.\n]*?(non[-\s]?amplified|not\s+amplified|negative|amplified|positive)/i);
    if (fm) fish = /non|not|negative/i.test(fm[1]) ? "FISH-" : "FISH+";

    let m = tail.match(/score\s*[:=]?\s*([0-3])(\s*\+)?/i);
    if (m) return { score: m[1] === "0" ? "0" : `${m[1]}+`, zeroDetail: m[1] === "0" ? extractHer2ZeroDetail(tail) : fish, ok: true };
    m = tail.match(/([0-3])\s*\+/);
    if (m) return { score: `${m[1]}+`, zeroDetail: fish, ok: true };
    m = tail.match(/\(\s*([0-3])\s*\)/);
    if (m) return { score: m[1], zeroDetail: m[1] === "0" ? extractHer2ZeroDetail(tail) : "", ok: true };
    if (/equivocal/i.test(tail)) return { score: "2+", zeroDetail: fish, ok: true };
    if (/\bnegative\b/i.test(tail)) return { score: "0", zeroDetail: extractHer2ZeroDetail(tail) || "(0%)", ok: true };
    if (/\bpositive\b/i.test(tail)) return { score: "3+", zeroDetail: fish, ok: true };
  }
  return { score: "", zeroDetail: "", ok: false };
}

function formatHer2Value(rawNum, zeroDetail, withPercentDetail) {
  const clean = (rawNum || "").replace(/＋/g, "+").trim();
  if (!clean) return "";
  if (/^[0-3]\+$/.test(clean)) return `HER2(${clean}${zeroDetail ? ", " + zeroDetail : ""})`;
  if (clean === "0") return withPercentDetail && zeroDetail ? `HER2(0)${zeroDetail}` : "HER2(0)";
  if (/%$/.test(clean)) return `HER2(${clean})`;
  return withPercentDetail ? `HER2(${clean}%)` : `HER2(${clean})`;
}

/* ---------- ER / PR / Ki-67 ---------- */
function parseHormone(text, longRe, shortRe, prefix) {
  const lines = (text || "").split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const a = line.match(longRe), b = line.match(shortRe);
    const m = [a, b].filter(Boolean).sort((x, y) => x.index - y.index)[0];
    if (!m) continue;
    let rest = line.slice(m.index + m[0].length);
    if (lines[i + 1] && /^\s{4,}\S/.test(lines[i + 1])) rest += " " + lines[i + 1].trim();
    const ci = rest.search(/[:：]/);
    let val = ci >= 0 ? rest.slice(ci + 1) : rest.replace(/^\s*[-–—]\s*/, "");
    if (ci < 0 && /prior\s+(?:core\s+)?biops/i.test(line)) continue;
    val = val.replace(/＋/g, "+").trim();
    const range = val.match(/(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s*%/);
    const lt = val.match(/(?:less\s+than|<)\s*(\d+(?:\.\d+)?)\s*%/i);
    const single = val.match(/([>≥]?\s*\d+(?:\.\d+)?)\s*%/);
    if (/\bnegative\b|not\s+detected|no\s+(?:nuclear\s+)?staining/i.test(val)) return { val: `${prefix}(negative)`, ok: true };
    if (range) return { val: `${prefix}(${range[2]}%)`, ok: true };
    if (lt) return { val: parseFloat(lt[1]) <= 1 ? `${prefix}(negative)` : `${prefix}(<${lt[1]}%)`, ok: true };
    if (single) {
      const n = parseFloat(single[1].replace(/[^\d.]/g, ""));
      return { val: n === 0 ? `${prefix}(negative)` : `${prefix}(${single[1].replace(/\s+/g, "")}%)`, ok: true };
    }
    if (/\bpositive\b|\bweak|\bmoderate|\bstrong/i.test(val)) return { val: `${prefix}(positive)`, ok: true };
  }
  return { val: "", ok: false };
}

function parseKi67(text) {
  for (const line of (text || "").split(/\r?\n/)) {
    const m = line.match(/\bki-?67\b/i);
    if (!m) continue;
    let rest = line.slice(m.index + m[0].length).replace(/\((?![^)]*%)[^)]*\)/g, " ");
    const range = rest.match(/(\d+(?:\.\d+)?)\s*[-–]\s*(\d+(?:\.\d+)?)\s*%/);
    const lt = rest.match(/(?:<|less\s+than)\s*(\d+(?:\.\d+)?)\s*%/i);
    const gt = rest.match(/(?:>|more\s+than|greater\s+than)\s*(\d+(?:\.\d+)?)\s*%/i);
    const one = rest.match(/(\d+(?:\.\d+)?)\s*%/);
    if (range) return { range: `ki-67 ${range[1]}-${range[2]}%`, upper: `ki-67 ${range[2]}%`, ok: true };
    if (lt) return { range: `ki-67 <${lt[1]}%`, upper: `ki-67 <${lt[1]}%`, ok: true };
    if (gt) return { range: `ki-67 >${gt[1]}%`, upper: `ki-67 >${gt[1]}%`, ok: true };
    if (one) return { range: `ki-67 ${one[1]}%`, upper: `ki-67 ${one[1]}%`, ok: true };
  }
  return { range: "", upper: "", ok: false };
}

/* ---------- 乳癌 LN 分區 / ENE（修掉原本 [A-Z]{3,} 加 i flag 導致區段被截空的 bug） ---------- */
function extractBreastLnDetails(text, sec) {
  const scope = sec ? sec : text || "";
  const details = [];
  for (const z of parseLnZones(scope.replace(/\n[ \t]{6,}/g, " "))) {
    const ene = detectEne(z.rest);
    if (z.pos > 0 || ene === true) details.push(`${z.name} ${z.pos}/${z.tot}${ene === true ? " ENE+" : ene === false ? " ENE-" : ""}`);
  }
  if (details.length === 0) {
    const e = detectEne(scope);
    if (e === true) details.push("ENE+");
    else if (e === false) details.push("ENE-");
    else if (/isolated\s+tumor\s+cells|\bITCs?\b/i.test(scope)) {
      const parts = ["ITCs"];
      const sz = scope.match(/largest\s+size\s+of\s+metastatic\s+deposit\s*[:\-]?\s*([<>]?\s*\d+(?:\.\d+)?\s*(?:mm|cm))/i);
      if (sz) parts.push(sz[1].replace(/\s+/g, ""));
      details.push(parts.join(", "));
    }
  }
  return { detailStr: details.join(", ") };
}

function parseBreastLn(text) {
  const sec = getField(text, "(?:axillary\\s+|regional\\s+)?(?:sentinel\\s+)?(?:lymph\\s+)?nodes?(?:\\s+status)?|nodal\\s+status");
  const f = _flat(sec);
  let m, ln = "";
  if (sec !== null && f) {
    m = f.match(/overall\s+(\d+)\s*\/\s*(\d+)/i) || f.match(/\(\s*(\d+)\s*\/\s*(\d+)/) || f.match(/(\d+)\s*\/\s*(\d+)/);
    if (m) ln = +m[2] === 0 ? "no LN identified (0/0)" : `${m[1]}/${m[2]} LN involved`;
    else {
      const ex = f.match(/(?:examined|total\s+(?:number|no\.?)[^:]*)\s*[:=]?\s*(\d+)/i);
      let pos = 0, any = false;
      for (const mm of f.matchAll(/(?:macro|micro)metastas[ie]s[^:\d]*[:=]\s*(\d+)/gi)) { pos += +mm[1]; any = true; }
      if (ex && (any || /negative|no\s+metasta/i.test(f))) ln = `${pos}/${ex[1]} LN involved`;
    }
    if (!ln && /isolated\s+tumor\s+cells|\bITCs?\b/i.test(f)) ln = "ITCs in LN";
    if (!ln && /not\s+assessable|not\s+evaluated/i.test(f)) ln = "LN not assessable";
  }
  return { ln, sec };
}

/* ===================================================================
 * 乳癌解析（回傳格式與原版完全相同）
 * =================================================================== */
function parseBreastReport(raw) {
  const text = raw || "";
  const found = {};

  // Grade
  let grade = "";
  const gv = getField(text, "(?:histologic|nottingham(?:\\s+histologic)?|nuclear|tumou?r)\\s+grade|grade");
  if (gv !== null) { grade = gradeFromValue(gv); found.grade = Boolean(grade); }

  // Histologic type
  let histType = "invasive carcinoma", isPureDcis = false;
  const hv = getField(text, "histologic(?:al)?\\s+type|tumou?r\\s+type|histologic\\s+diagnosis");
  if (hv !== null && _flat(hv)) {
    const h = _flat(hv).replace(/\[[^\]]*\]/g, "").trim();
    if (/no\s+residual\s+invasive\s+carcinoma/i.test(h)) histType = "no residual invasive carcinoma";
    else if (/^(?:ductal\s+carcinoma\s+in\s+situ|DCIS)\b/i.test(h) && !/invasive/i.test(h)) { histType = "DCIS"; isPureDcis = true; }
    else if (/^(?:lobular\s+carcinoma\s+in\s+situ|LCIS)\b/i.test(h)) histType = "LCIS";
    else if (/invasive\s+lobular|\bILC\b/i.test(h)) histType = "invasive lobular carcinoma";
    else if (/invasive\s+ductal|\bIDC\b/i.test(h)) histType = "invasive ductal carcinoma";
    else if (/invasive\s+carcinoma|\bNST\b/i.test(h)) histType = "invasive carcinoma";
    else histType = h.replace(/[.;].*$/, "").split(",")[0].toLowerCase();
    found.histType = true;
  } else if (/invasive\s+lobular\s+carcinoma|\bILC\b/i.test(text)) { histType = "invasive lobular carcinoma"; found.histType = true; }
  else if (/ductal\s+carcinoma\s+in\s+situ/i.test(text) && !/\binvasive\s+(?:ductal\s+|lobular\s+)?carcinoma\b/i.test(text.replace(/no\s+residual\s+invasive\s+carcinoma/gi, ""))) {
    histType = "DCIS"; isPureDcis = true; found.histType = true;
  }

  // Size：優先「invasive」大小，其次 DCIS / 一般 size
  let size = "";
  const sv = getField(text, "(?:tumou?r\\s+)?size(?:\\s*\\([^)]*\\))?\\s+of\\s+(?:the\\s+)?invasive\\s+(?:carcinoma|component|tumou?r)") ??
             getField(text, "(?:tumou?r\\s+)?size(?:\\s*\\([^)]*\\))?(?:\\s+of\\s+(?:the\\s+)?(?:dcis|tumou?r|lesion|carcinoma))?");
  if (sv !== null) { size = sizeFromScope(sv); found.size = Boolean(size); }

  // Treatment effect
  const txRes = parseBreastTreatmentEffect(text);
  const treatment = txRes.val;
  found.treatment = txRes.ok;

  // LVI
  let lvi = "LVI-";
  const lv = getField(text, "(?:peritumou?ral\\s+)?(?:lymph(?:o|atic)?[\\s-]*(?:\\/|and\\s+|or\\s+)?[\\s-]*vascular|lymphatic|angiolymphatic|vascular)\\s+(?:space\\s+)?invasion|LVI");
  const ls = signOf(lv);
  if (ls !== null) { lvi = ls ? "LVI+" : "LVI-"; found.lvi = true; }

  // Margin
  let marginRes = { short: "", full: "", ok: false };
  const mSec = getField(text, "(?:surgical\\s+)?margins?(?:\\s+of\\s+excision|\\s+status)?");
  if (mSec !== null) marginRes = parseBreastMargins("Margins: " + mSec);
  if (!marginRes.ok) marginRes = parseBreastMargins(text);
  found.margin = marginRes.ok;

  // Lymph nodes
  const lnRes = parseBreastLn(text);
  const ln = lnRes.ln;
  found.ln = Boolean(ln);
  const lnDetail = extractBreastLnDetails(text, lnRes.sec).detailStr;
  found.lnDetail = Boolean(lnDetail);

  // ER / PR / HER2 / Ki-67
  const erRes = parseHormone(text, /\bestrogen\s+receptor\b/i, /(?<![A-Za-z])ER(?![A-Za-z\/])/, "ER");
  const prRes = parseHormone(text, /\bprogesterone\s+receptor\b/i, /(?<![A-Za-z\/])PR(?![A-Za-z])/, "PR");
  found.er = erRes.ok; found.pr = prRes.ok;
  const her2Res = parseHer2Score(text);
  found.her2 = her2Res.ok;
  const kRes = parseKi67(text);
  found.ki67 = kRes.ok;

  // Stage
  const tnm = parseTNM(text, lnRes.sec, true);
  let stage = tnm.stage;
  if (!stage && isPureDcis && (found.margin || found.ln)) stage = "pTis";
  found.stage = Boolean(stage);

  return {
    grade, histType, size, treatment, lvi,
    marginShort: marginRes.short, marginFull: marginRes.full,
    ln, lnDetail, er: erRes.val, pr: prRes.val,
    her2Num: her2Res.score, her2ZeroDetail: her2Res.zeroDetail,
    ki67Range: kRes.range, ki67Upper: kRes.upper, stage, found
  };
}

/* ===================================================================
 * 頭頸癌解析（回傳格式與原版完全相同）
 * =================================================================== */
function parseHeadNeckReport(raw) {
  const text = raw || "";
  const found = {};

  // Size
  let size = "";
  const sv = getField(text, "(?:tumou?r\\s+)?size|tumou?r\\s+dimension|greatest\\s+dimension");
  if (sv !== null) size = sizeFromScope(sv);
  if (!size) {
    const m = text.match(/tumou?r\s+(?:about\s+)?(\d+(?:\.\d+)?)\s*(cm|mm)/i);
    if (m) size = m[2].toLowerCase() === "mm" ? `${+(m[1] / 10).toFixed(2)}cm` : `${m[1]}cm`;
  }
  found.size = Boolean(size);

  // Grade
  const grade = gradeFromValue(getField(text, "histologic\\s+grade|tumou?r\\s+grade|differentiation|grade"));
  found.grade = Boolean(grade);

  // Histologic type
  let histType = "squamous cell carcinoma";
  const hv = getField(text, "histologic(?:al)?\\s+type|tumou?r\\s+type");
  if (hv !== null && _flat(hv)) {
    histType = /squamous\s+cell\s+carcinoma/i.test(hv) ? "squamous cell carcinoma" : _flat(hv).split(",")[0];
    found.histType = true;
  }

  // DOI
  let doi = "";
  const dm = text.match(/(?:depth\s+of\s+invasion|\bDOI\b)(?:\s*\([^)]*\))?\s*[:\-–—=]?\s*(?:about\s+|approximately\s+|>|<)?(\d+(?:\.\d+)?)\s*(mm|cm)/i);
  if (dm) { doi = `DOI ${dm[1]}${dm[2].toLowerCase()}`; found.doi = true; }

  // Treatment effect
  let treatment = "";
  const tv = getField(text, "treatment\\s+effect");
  if (tv !== null) {
    const t = _flat(tv).toLowerCase();
    if (t && !/^n\/?a\b|not\s+applicable|no\s+info|not\s+evaluated|none\s+identified|no\s+definite/i.test(t)) {
      if (/moderate\s+response/.test(t)) treatment = "moderate treatment response";
      else if (/complete\s+response|pathologic\s+complete/.test(t)) treatment = "complete treatment response";
      else if (/marked\s+response/.test(t)) treatment = "marked treatment response";
      else if (/minimal\s+response|poor\s+response/.test(t)) treatment = "minimal treatment response";
      else treatment = _flat(tv).replace(/^present\s*;?\s*/i, "");
      found.treatment = true;
    }
  }

  // LVI / PNI / WPOI
  const bin = (labelSrc, neg, pos) => {
    const v = getField(text, labelSrc);
    const s = signOf(v);
    return s === null ? { val: neg, ok: false } : { val: s ? pos : neg, ok: true };
  };
  const lviRes = bin("(?:lymph(?:o|atic)?[\\s-]*(?:\\/|and\\s+|or\\s+)?[\\s-]*vascular|lymphatic|angiolymphatic|vascular)\\s+(?:space\\s+)?invasion|LVI", "LVI-", "LVI+");
  const pniRes = bin("(?:perineural|neural)\\s+invasion|PNI", "PNI-", "PNI+");
  let wpoiRes = bin("worst\\s+pattern\\s+of\\s+invasion|WPOI", "WPOI-", "WPOI+");
  if (!wpoiRes.ok) {
    const n = _flat(getField(text, "worst\\s+pattern\\s+of\\s+invasion|WPOI")).match(/\b([1-5])\b/);
    if (n) wpoiRes = { val: `WPOI(${n[1]})`, ok: true };
  }
  found.lvi = lviRes.ok; found.pni = pniRes.ok; found.wpoi = wpoiRes.ok;

  // Margin
  let margin = "";
  const mSec = getField(text, "(?:surgical\\s+)?margins?(?:\\s+of\\s+excision|\\s+status)?");
  if (mSec !== null && _flat(mSec)) {
    const mClean = _flat(mSec);
    const parts = [];
    const inv = mClean.match(/(?:both\s+the\s+|the\s+)?([a-z0-9\s,&/-]+?)\s+margins?\s+(?:are|is)\s+involved/i);
    if (inv) parts.push(`involved at ${inv[1].replace(/\b(the|both|and)\b/gi, " ").replace(/\s+/g, " & ").trim()}`);
    const cl = mClean.match(/([a-z0-9\s,&/-]+?)\s+margin\s+is\s+close[^(<]*\(\s*(<\s*\d+\s*mm|\d+(?:\.\d+)?\s*mm)\s*\)/i);
    if (cl) parts.push(`${cl[2].replace(/\s+/g, "")} at ${cl[1].replace(/\bthe\b/gi, "").trim()}`);
    const ds = mClean.match(/(\d+(?:\.\d+)?\s*(?:cm|mm))\s+at\s+([a-z0-9\s-]+?)(?=\s+margin|\s*[.;]|$)/i);
    if (ds) parts.push(`${ds[1].replace(/\s+/g, "")} at ${ds[2].trim()}`);
    if (!parts.length) {
      if (/involved|positive\s+for\s+(?:carcinoma|tumou?r)|margin\s+positive/i.test(mClean) && !/(?:not|un)involved|negative/i.test(mClean)) parts.push("involved");
      else {
        const dd = mClean.match(/(?:closest|nearest|distance)[^0-9<]{0,40}([<>]?\s*\d+(?:\.\d+)?\s*(?:mm|cm))/i);
        if (dd) parts.push(dd[1].replace(/\s+/g, ""));
        else if (/free|negative|uninvolved|clear/i.test(mClean)) parts.push("free");
      }
    }
    if (parts.length) { margin = `margin ${parts.join(", ")}`; found.margin = true; }
  }

  // Lymph nodes
  const lnSec = getField(text, "(?:regional\\s+)?lymph\\s+nodes?(?:\\s+status)?|neck\\s+dissection|nodal\\s+status");
  const scope = lnSec !== null ? lnSec : text;
  const zones = parseLnZones(scope);
  const fs = _flat(scope);
  let pos = null, tot = null;
  const ov = fs.match(/(?:overall|total)[^0-9]{0,30}(\d+)\s*\/\s*(\d+)/i);
  if (ov) { pos = +ov[1]; tot = +ov[2]; }
  else if (zones.length) { pos = zones.reduce((a, z) => a + z.pos, 0); tot = zones.reduce((a, z) => a + z.tot, 0); }
  else if (lnSec !== null) { const m = fs.match(/(\d+)\s*\/\s*(\d+)/); if (m) { pos = +m[1]; tot = +m[2]; } }
  let ln = "";
  if (pos !== null) {
    let lat = "";
    const hasL = /\bleft\b/i.test(scope), hasR = /\bright\b/i.test(scope);
    if (/bilateral/i.test(scope) || (hasL && hasR)) lat = " (bilateral)";
    else if (hasL) lat = " (left)";
    else if (hasR) lat = " (right)";
    ln = `${pos}/${tot} LN involved${lat}`;
    found.ln = true;
  }
  const lnZones = zones.filter((z) => z.pos > 0)
    .map((z) => `${z.name.replace(/^level\s+/i, "")} ${z.pos}/${z.tot}${detectEne(z.rest) === true ? " ENE+" : ""}`).join(", ");
  found.lnZones = Boolean(lnZones);

  // ENE
  let eneShort = "ENE-", eneDetail = "ENE-";
  const eneState = detectEne(scope) !== null ? detectEne(scope) : detectEne(text);
  if (eneState === true) {
    eneShort = "ENE+";
    const d = [];

function cleanEng(str) {
  return String(str || "")
    .replace(/[\u3400-\u9FFF\uF900-\uFAFF]/g, "")
    .replace(/[ \t]+/g, " ")
    .replace(/\n{3,}/g, "\n\n")

function fmtNum(n) {
  if (isNaN(n)) return "";

function isCheckedCell(tok) {

function extractCheckedLabels(blockText) {
  const out = [];
  if (!blockText) return out;
  const lines = blockText.split(/\r?\n/);

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    const tokenRegex = /(?:\([^)]*\)|\[[^\]]*\])/g;
    const tokens = [];
    let m;
    while ((m = tokenRegex.exec(line)) !== null) {
      tokens.push({ raw: m[0], start: m.index, end: m.index + m[0].length });
    }

    for (let j = 0; j < tokens.length; j++) {
      if (!isCheckedCell(tokens[j].raw)) continue;
      const textStart = tokens[j].end;
      const textEnd = (j + 1 < tokens.length) ? tokens[j + 1].start : line.length;
      let label = line.slice(textStart, textEnd)
        .replace(/^[:\s_;,.]+/, "")
        .replace(/[:\s_;,.]+$/, "")
        .trim();

      if (label && label !== "-" && !/number\s+of\s+suspicious\s+lymph\s+node/i.test(label) && out.indexOf(label) === -1) {
        out.push(label);
      }
    }
  }
  return out;
}

  const sMatch = text.match(startRe);
  if (!sMatch || typeof sMatch.index !== "number") return "";
  const sub = text.slice(sMatch.index);
  let cut = sub.length;
  for (let i = 0; i < endReList.length; i++) {
    const eMatch = sub.slice(5).match(endReList[i]);
    if (eMatch && typeof eMatch.index === "number") {
      const pos = eMatch.index + 5;
      if (pos < cut) cut = pos;
    }
  }
  return sub.slice(0, cut);
}

function extractRowCells(line) {

function parseNeckTable(sec3) {

  for (let i = 0; i < lines.length; i++) {

    if (!line) continue;

    const lvlM = line.match(/^(VII|VI|IV|V|III|II|I)(?:[\s\u3000]|$)/i);
    if (lvlM) {
      const lvlName = lvlM[1].toUpperCase();
      let cells = extractRowCells(line.slice(lvlM[0].length));
      if (cells.length < 2 && i + 1 < lines.length) {
        const nextCells = extractRowCells(lines[i + 1]);
        if (nextCells.length >= 2) cells = nextCells;
      }
      if (cells.length >= 2) {
        if (isCheckedCell(cells[cells.length - 2]) && rtLvl.indexOf(lvlName) === -1) rtLvl.push(lvlName);
        if (isCheckedCell(cells[cells.length - 1]) && ltLvl.indexOf(lvlName) === -1) ltLvl.push(lvlName);

    }

    const regM = line.match(/^(Facial\s+nodes|Parapharyngeal|Parotid|Suboccipital(?:\s*\/?\s*retroauricular)?)(?:[\s\u3000]|$)/i);
    if (regM) {
      let regName = regM[1].replace(/\s+/g, " ").toLowerCase();
      let cells = extractRowCells(line.slice(regM[0].length));
      if (cells.length < 2 && i + 1 < lines.length) {
        const nextLine = lines[i + 1].trim();
        if (/retroauricular/i.test(nextLine)) regName = "suboccipital/retroauricular";
        const nextCells = extractRowCells(nextLine);
        if (nextCells.length >= 2) cells = nextCells;
      }
      if (cells.length >= 2) {
        if (isCheckedCell(cells[cells.length - 2]) && rtReg.indexOf(regName) === -1) rtReg.push(regName);
        if (isCheckedCell(cells[cells.length - 1]) && ltReg.indexOf(regName) === -1) ltReg.push(regName);

    tumorLoc = [lat, subText].filter(Boolean).join(" ");
  } else {
    const impLoc = text.match(/\b(Left|Right|Rt|Lt|Bilateral)\s+([A-Za-z\s]+?)\s+(?:carcinoma|cancer|tumor|mass)/i);
    if (impLoc) {
      const side = /^rt$/i.test(impLoc[1]) ? "Right" : /^lt$/i.test(impLoc[1]) ? "Left" : impLoc[1];
      tumorLoc = side + " " + impLoc[2].trim().toLowerCase();
    }
  }

  // 2. Tumor Size (+ depth)
  let tumorSize = "Not specified";
  const szPool = sec1 || text;
  const numPat = "_*(\\d+(?:\\.\\d+)?)_*";
  const mmcm = function(v, u) { return fmtNum(v) + " " + u.toLowerCase(); };
  const dim3 = szPool.match(new RegExp("Size\\b\\s*:?\\s*" + numPat + "\\s*[*xX]\\s*" + numPat + "(?:\\s*[*xX]\\s*" + numPat + ")?\\s*(mm|cm)", "i"))
    || szPool.match(new RegExp(numPat + "\\s*[*xX]\\s*" + numPat + "(?:\\s*[*xX]\\s*" + numPat + ")?\\s*(mm|cm)", "i"));
  if (dim3) {
    const nums = [parseFloat(dim3[1]), parseFloat(dim3[2]), dim3[3] ? parseFloat(dim3[3]) : 0].filter(function(n) { return !isNaN(n); });
    tumorSize = mmcm(Math.max.apply(null, nums), dim3[4]);
  } else {
    const sz1 = szPool.match(new RegExp("Size\\b\\s*:?\\s*" + numPat + "\\s*(mm|cm)", "i"));
    if (sz1) tumorSize = mmcm(parseFloat(sz1[1]), sz1[2]);
  }

  // 3. TN(M) Stage
  let tStage = "", nStage = "", mStage = "";
  const tnMatch = text.match(/(?<![A-Za-z0-9])(T[0-4][a-c]?)\s*(N[0-3][a-c]?)(?:\s*(M[0-1xX][a-c]?))?(?![A-Za-z0-9])/i);
  if (tnMatch) { tStage = tnMatch[1]; nStage = tnMatch[2]; mStage = tnMatch[3] || ""; }

  const checked2 = extractCheckedLabels(sec2);
  const tMarkers = [];
  const invItems = [];
  for (let i = 0; i < checked2.length; i++) {
    const item = checked2[i];
    const tm = item.match(/^(T[0-4][a-c]?)\b/i);
    if (tm) tMarkers.push(tm[1]);
    else if (!/^(?:Not assessable|No regional invasion|Tumor cannot be visualized in this imaging study)$/i.test(item)) invItems.push(item);
  }
  if (!tStage && tMarkers.length > 0) tStage = tMarkers[tMarkers.length - 1];

  const nOpt = findCheckedOption(sec3, "N");
  if (!nStage && nOpt) nStage = nOpt.code;
  if (!nStage) {
    const nLineMatch = sec3.match(/(?:\([^)]*\)|\[[^\]]*\])\s*(N[0-3][a-c]?)\b/i);
    if (nLineMatch) nStage = nLineMatch[1];
  }

  let lnCount = null, lnOp = "";
  const lnCntMatch = sec3.match(/number\s+of\s+suspicious\s+lymph\s+node\s*:?\s*_*\s*([<>≥≤]?)\s*(\d+)_*/i);
  if (lnCntMatch) { lnOp = lnCntMatch[1] || ""; lnCount = parseInt(lnCntMatch[2], 10); }

  if (!tStage && invItems.length > 0) {
    const joinedInv = invItems.join(" ").toLowerCase();
    if (/within colonic or rectal wall/.test(joinedInv)) tStage = "T1/T2";
    else if (/non-peritonenalized pericolonic|non-peritonealized pericolonic|perirectal tissues/.test(joinedInv)) tStage = "T3";
    else if (/visceral peritoneum|adjacent organs/.test(joinedInv)) tStage = "T4";
  }

  if (!nStage && lnCount !== null) {
    if (lnCount === 0) nStage = "N0";
    else if (lnCount === 1) nStage = "N1a";
    else if (lnCount <= 3) nStage = "N1b";
    else if (lnCount <= 6) nStage = "N2a";
    else nStage = "N2b";
  }

  const tnStr = [tStage, nStage, mStage].filter(Boolean).join(" ") || "Not specified";

  // 4. Local invasion line (colorectal-style)
  let invLine = "No regional invasion specified";
  if (invItems.length > 0) {
    invLine = invItems.map(function(s, idx) { return idx === 0 ? s.charAt(0).toUpperCase() + s.slice(1) : s.toLowerCase(); }).join(", ");
  } else if (tMarkers.length > 0) {
    const tRow = checked2.find(function(x) { return /^T[0-4][a-c]?/i.test(x); });
    if (tRow) invLine = tRow.replace(/^T[0-4][a-c]?\s*:?\s*/i, "");
  }

  // 5. Nodal line
  const isHN = /\bLevel\s+Rt\s+Lt\b/i.test(sec3) || /3\.\s*Neck\s*Lymph\s*Node/i.test(sec3);
  const isColorectalStyle = !isHN && /(?:^|\n)\s*(?:3\.\s*)?Regional\s+nodal\s+metastasis/i.test(sec3);
  let nodeLine = "No regional nodal metastasis";
  let tBasis = "", nBasis = "";

  if (isColorectalStyle) {
    const locs = [];
    const lines3 = sec3.split(/\r?\n/);
    for (let i = 0; i < lines3.length; i++) {
      const tr = lines3[i].trim();
      if (!tr || /^(?:3\.|No or Equiv|If yes,)/i.test(tr) || /^[A-Za-z][A-Za-z\s\/\-]+:\s*$/.test(tr)) continue;
      const found = extractCheckedLabels(tr);
      for (let j = 0; j < found.length; j++) {
        const low = found[j].toLowerCase();
        if (low && locs.indexOf(low) === -1) locs.push(low);
      }
    }
    if (lnCount !== null || locs.length > 0) {
      const cTxt = lnCount !== null ? lnOp + lnCount + " lymph node" + (lnCount === 1 ? "" : "s") : "Positive regional lymph nodes";
      nodeLine = cTxt + (locs.length > 0 ? " (" + locs.join(", ") + ")" : "");
    }
  } else {
    const neck = parseNeckTable(sec3);
    const hasR = neck.rtLvl.length > 0 || neck.rtReg.length > 0;
    const hasL = neck.ltLvl.length > 0 || neck.ltReg.length > 0;

    const szMatch = sec3.match(new RegExp("maximum\\s+size\\s+(?:of\\s+(?:the\\s+)?(?:largest\\s+)?(?:positive\\s+)?)?node\\s*:?\\s*" + numPat + "\\s*(cm|mm)", "i"));
    let szTxt = "";
    if (szMatch) {
      const v = parseFloat(szMatch[1]);
      szTxt = "max " + fmtNum(szMatch[2].toLowerCase() === "mm" ? v / 10 : v) + " cm";
    }

    // ENE：標題勾選 / A-G 任一勾選 / N3b 或 N 選項文字含 ENE(+)
    let eneTxt = "";
    if (/ENE/i.test(sec3)) {
      const eneHdr = sec3.match(/ENE\s*\(\s*([^)]*?)\s*\)\s*:/i);
      const eneBlock = sliceBetween(sec3, /ENE\s*\([^)]*\)\s*:/i, [/\n\s*[\(\[][^\n]{0,3}[\)\]]\s*N[0-3]/i]);
      const eneSub = extractCheckedLabels(eneBlock).map(function(s) { return s.replace(/^[A-G]\.\s*/, ""); });
      const hdrOn = eneHdr && isCheckedCell("(" + eneHdr[1] + ")");
      const nOn = nOpt && (/^N3b$/i.test(nOpt.code) || /ENE\(\+\)/.test(nOpt.text));
      eneTxt = (hdrOn || eneSub.length > 0 || nOn) ? "ENE(+)" + (eneSub.length ? " (" + eneSub.join("; ") + ")" : "") : "ENE(-)";
    }

    if (hasR || hasL) {
      const details = [];
      if (neck.rtLvl.length > 0) details.push("Rt level " + neck.rtLvl.join(", "));
      if (neck.rtReg.length > 0) details.push("Rt " + neck.rtReg.join(", "));
      if (neck.ltLvl.length > 0) details.push("Lt level " + neck.ltLvl.join(", "));
      if (neck.ltReg.length > 0) details.push("Lt " + neck.ltReg.join(", "));
      nodeLine = ["Involved neck LN: " + details.join("; "), szTxt, eneTxt].filter(Boolean).join("; ");
    } else {
      const c3 = extractCheckedLabels(sec3);
      if (c3.some(function(x) { return /^Not assessable/i.test(x); })) nodeLine = "Neck LN not assessable";
      else if (nStage && !/^N0$/i.test(nStage)) nodeLine = "Neck LN involved (" + nStage + "), level not specified" + (szTxt ? "; " + szTxt : "") + (eneTxt ? "; " + eneTxt : "");
    }

    // 實際侵犯範圍（只列勾選的侵犯部位，不加標題）
    if (invItems.length > 0) {
      tBasis = invItems.map(function(x, i) { return i === 0 ? x.charAt(0).toUpperCase() + x.slice(1) : lowerFirst(x); }).join(", ");
    }
  }

  const lines = isHN
    ? [ "Tumor Location: " + tumorLoc, "Tumor Size: " + tumorSize, tBasis, nodeLine, "TN Stage: " + tnStr ]
    : [ "Tumor Location: " + tumorLoc, "Tumor Size: " + tumorSize, invLine, nodeLine, "TN Stage: " + tnStr ];
  return cleanEng(lines.filter(Boolean).join("\n"));
}


/* ===== 報告類型判斷與主流程 ===== */
const KIND_LABEL = { path_breast: "Pathology · Breast", path_hn: "Pathology · Head & Neck", us: "Breast Ultrasound", ctmri: "CT / MRI Staging" };

function detectKind(raw) {
  const count = function(re) { return (raw.match(re) || []).length; };
  const pathScore = count(/MICROSCOPIC\s+(?:FINDINGS|EVALUATION|DESCRIPTION|EXAMINATION)|\bhistologic(?:al)?\s+(?:type|grade)\b|immunohistochemical|nottingham|\bsurgical\s+margins?\b|\bmargins?\s+of\s+excision\b|treatment\s+effect|worst\s+pattern\s+of\s+invasion|perineural\s+invasion|lymph-?\s*vascular\s+invasion|\bDOI\b|depth\s+of\s+invasion|\bER\b[^\n]*clone|estrogen\s+receptor/gi);
  const imgScore = count(/BI-?RADS|sonograph|ultrasound|\bImage\s+TNM\b|\bMRI?\b|\bCT\b|computed\s+tomography|magnetic\s+resonance|Tumor\s+invasion|Neck\s+Lymph\s+Node|Regional\s+nodal\s+metastasis|Tumor\s+location\s*\/\s*Size/gi)
    + (count(/[\(\[]\s*[_vVxX]\s*[\)\]]/g) >= 3 ? 3 : 0);
  return pathScore > imgScore ? "path" : "img";
}

function resolveKind(raw) {
  const sel = document.getElementById("typeSel").value;
  if (sel !== "auto") return sel;
  if (detectKind(raw) === "path") return detectCancerType(raw).type === "breast" ? "path_breast" : "path_hn";
  return isBreastUS(raw) ? "us" : "ctmri";
}

function renderChips(kind) {
  const box = document.getElementById("chipBox");
  const type = kind === "path_breast" ? "breast" : kind === "path_hn" ? "headneck" : "";
  if (!type) { box.style.display = "none"; box.dataset.type = ""; return; }
  box.style.display = "flex";
  if (box.dataset.type !== type) {
    box.innerHTML = CHIPS[type].map(function(c) { return '<button type="button" class="chip" data-opt="' + c[0] + '"></button>'; }).join("");
    box.dataset.type = type;
    box.querySelectorAll(".chip").forEach(function(el) { el.addEventListener("click", function() { toggleOption(el.dataset.opt); }); });
  }
  CHIPS[type].forEach(function(c) {
    const el = box.querySelector('[data-opt="' + c[0] + '"]');
    const on = state.options[c[0]];
    el.classList.toggle("active", on);
    el.textContent = on ? c[1] : (c[2] || c[1]);
  });
}

function toggleOption(key) { state.options[key] = !state.options[key]; runExtract(); }

function runExtract() {
  const raw = document.getElementById("reportInput").value.trim();
  const outEl = document.getElementById("emrOutput");
  const badgeEl = document.getElementById("reportBadge");
  if (!raw) { outEl.value = ""; badgeEl.textContent = "Ready"; renderChips(""); return; }
  try {
    const kind = resolveKind(raw);
    const manual = document.getElementById("typeSel").value !== "auto";
    badgeEl.textContent = KIND_LABEL[kind] + (manual ? " (manual)" : "");
    renderChips(kind);
    if (kind === "path_breast") {
      state.autoParsed.breast = parseBreastReport(raw);
      outEl.value = buildBreastSummary(getEffectiveBreastParams());
    } else if (kind === "path_hn") {
      state.autoParsed.headneck = parseHeadNeckReport(raw);
      outEl.value = buildHnSummary(getEffectiveHnParams());
    } else if (kind === "us") {
      outEl.value = parseBreastUS(raw);
    } else {
      outEl.value = parseCTMRI(raw);
    }
  } catch (e) {
    badgeEl.textContent = "Error";
    outEl.value = "Error: " + (e && e.message ? e.message : String(e));
  }
}

document.getElementById("reportInput").addEventListener("input", runExtract);
document.getElementById("typeSel").addEventListener("change", runExtract);
document.getElementById("clearBtn").addEventListener("click", function() {
  document.getElementById("emrOutput").value = "";
  document.getElementById("reportBadge").textContent = "Ready";
  renderChips("");
  const inEl = document.getElementById("reportInput");
  inEl.value = ""; inEl.focus();
});
document.getElementById("copyBtn").addEventListener("click", function() {
  const outEl = document.getElementById("emrOutput"), btn = document.getElementById("copyBtn");
  if (!outEl.value) return;
  const fallback = function() { outEl.select(); document.execCommand("copy"); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(outEl.value).catch(fallback);
  else fallback();
  btn.textContent = "Copied"; btn.classList.add("btn-copied");
  setTimeout(function() { btn.textContent = "Copy Result"; btn.classList.remove("btn-copied"); }, 1500);
});

document.getElementById("reportInput").value = SAMPLE_REPORT;
runExtract();
</script>
